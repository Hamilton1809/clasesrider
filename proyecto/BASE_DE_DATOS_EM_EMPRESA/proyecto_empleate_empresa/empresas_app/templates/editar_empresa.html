<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Empresa - Empléate</title>
    <style>
        /* Mismos estilos que crear_empresa.html para mantener consistencia */
        :root {
            --primary: #7097c0;
            --primary-hover: #577ba4;
            --bg: #f2f6f9;
            --surface: #ffffff;
            --text: #2b3947;
            --border: #d4e0eb;
            --input-focus: #cde0f2;
            --danger: #e28585;
            --edit: #f39c12;
            --edit-hover: #e67e22;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .form-container {
            background-color: var(--surface);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(112, 151, 192, 0.15);
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
            border-top: 4px solid var(--edit);
        }

        h1 { margin-top: 0; font-size: 1.6rem; margin-bottom: 1.5rem; text-align: center; color: var(--text); }

        .form-group { margin-bottom: 1.2rem; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: capitalize;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--edit);
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.2);
        }

        .error-text { color: var(--danger); font-size: 0.85rem; margin-top: 0.3rem; }

        .btn-submit {
            width: 100%;
            background-color: var(--edit);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        .btn-submit:hover { background-color: var(--edit-hover); }

        .btn-cancel {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #6a7c8e;
            text-decoration: none;
            font-weight: 500;
        }

        .btn-cancel:hover { text-decoration: underline; color: var(--text); }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Editar: {{ empresa.nombre }}</h1>
        <form method="POST" novalidate>
            {% csrf_token %}
            
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
                {{ field }}
                {% if field.errors %}
                    <div class="error-text">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="btn-submit">Guardar Cambios</button>
            <a href="{% url 'lista_empresas' %}" class="btn-cancel">Cancelar y volver</a>
        </form>
    </div>
</body>
</html>
