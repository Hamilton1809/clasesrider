<script>
    function togglePower() {
        const p = document.getElementById('pantalla');
        const icon = document.getElementById('power-icon');
        
        // Alternar clase de estado
        p.classList.toggle('active');
        
        // Cambiar color del icono según estado
        if (p.classList.contains('active')) {
            icon.style.color = '#7df9ff';
            icon.style.textShadow = '0 0 15px #7df9ff';
        } else {
            icon.style.color = '#333';
            icon.style.textShadow = 'none';
        }
    }
</script>
